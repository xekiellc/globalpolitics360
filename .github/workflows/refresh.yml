name: Refresh Articles

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch articles and generate teasers
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node fetch-articles.js

      - name: Commit and push updated articles.json
        run: |
          git config user.name "GP360 Bot"
          git config user.email "bot@globalpolitics360.com"
          git add articles.json podcasts.json tech.json archive.json videos.json
          git diff --staged --quiet || git commit -m "chore: auto-refresh articles $(date -u '+%Y-%m-%d %H:%M UTC')"
          git pull --rebase origin main
          git push

      - name: Post top article to XenChee
        env:
          PIPELINE_SECRET: ${{ secrets.PIPELINE_SECRET }}
        run: |
          TOP_TITLE=$(node -e "
            const fs = require('fs');
            const articles = JSON.parse(fs.readFileSync('articles.json', 'utf8'));
            const top = articles[0];
            if (top) console.log(top.title || '');
          ")
          TOP_SUMMARY=$(node -e "
            const fs = require('fs');
            const articles = JSON.parse(fs.readFileSync('articles.json', 'utf8'));
            const top = articles[0];
            if (top) console.log(top.teaser || top.description || '');
          ")
          TOP_URL=$(node -e "
            const fs = require('fs');
            const articles = JSON.parse(fs.readFileSync('articles.json', 'utf8'));
            const top = articles[0];
            if (top) console.log(top.url || top.link || '');
          ")
          if [ -n "$TOP_TITLE" ] && [ -n "$TOP_URL" ]; then
            curl -X POST https://xenchee.netlify.app/.netlify/functions/pipeline-post \
              -H "Content-Type: application/json" \
              -H "x-pipeline-secret: $PIPELINE_SECRET" \
              -d "{\"slug\":\"global-politics-360\",\"title\":\"$(echo $TOP_TITLE | sed 's/"/\\"/g')\",\"summary\":\"$(echo $TOP_SUMMARY | sed 's/"/\\"/g')\",\"url\":\"$TOP_URL\"}"
          fi
